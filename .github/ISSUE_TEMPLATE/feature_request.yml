name: Feature Request
description: Suggest a new feature for FinSight Pro
title: "[Feature] "
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: As a financial analyst, I need...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
      placeholder: I would like the app to...
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Target Tier
      description: Which edition should this feature be available in?
      options:
        - CLI Free (Open Source)
        - Pro Desktop ($99/yr)
        - Enterprise ($299/seat/yr)
        - All editions
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds?
      placeholder: Currently I'm using...
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, references, or any other context
