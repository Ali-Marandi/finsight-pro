name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-cli:
    name: CLI Tests (Python 3.10+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CLI
        run: pip install -e .
      - name: Run tests
        run: pytest tests/ -v

  typecheck-desktop:
    name: Desktop Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Type check renderer
        working-directory: desktop
        run: npx tsc --noEmit
      - name: Type check electron
        working-directory: desktop
        run: npx tsc -p tsconfig.electron.json --noEmit

  build-desktop:
    name: Build Desktop (Smoke Test)
    runs-on: ubuntu-latest
    needs: [typecheck-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run build
      - name: Verify outputs
        run: |
          test -f desktop/dist/renderer/index.html
          test -f desktop/dist/electron/main.js
          test -f desktop/dist/electron/preload.js
