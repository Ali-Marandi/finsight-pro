name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CLI Tests ──
  test-cli:
    name: CLI Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI + test deps
        run: |
          pip install -e .
          pip install pytest
      - name: Run CLI-only tests
        run: pytest tests/test_analysis.py tests/test_evidence.py -v --tb=short

  # ── API Tests ──
  test-api:
    name: API Tests (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt
      - name: Install system deps (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fas poppler-utils
      - name: Install API dependencies
        working-directory: api
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Start API server
        working-directory: api
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
      - name: Run API health check
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/health | python3 -m json.tool

  # ── Desktop TypeCheck ──
  typecheck-desktop:
    name: Desktop Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Type check renderer
        working-directory: desktop
        run: npx tsc --noEmit
      - name: Type check electron
        working-directory: desktop
        run: npx tsc -p tsconfig.electron.json --noEmit

  # ── Desktop Build Smoke Test ──
  build-desktop:
    name: Desktop Build (Smoke Test)
    runs-on: ubuntu-latest
    needs: [typecheck-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run build
      - name: Verify build outputs
        run: |
          echo "Checking build outputs..."
          test -f desktop/dist/renderer/index.html && echo "  renderer/index.html OK"
          test -f desktop/dist/electron/main.js && echo "  electron/main.js OK"
          test -f desktop/dist/electron/preload.js && echo "  electron/preload.js OK"
          echo "All outputs verified."
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: desktop/dist/
          retention-days: 3

  # ── Lint (Python) ──
  lint-python:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint CLI
        run: ruff check src/finsight/ --output-format=github || true
      - name: Lint API
        working-directory: api
        run: ruff check app/ --output-format=github || true
