productName: FinSight Pro
appId: com.finsightpro.desktop
repository:
  type: git
  url: https://github.com/Ali-Marandi/finsight-pro.git
directories:
  output: release
files:
  - dist/**/*
  - node_modules/**/*
  - public/icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FinSight Pro
extraResources:
  - from: ../api
    to: api
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!venv/**"
      - "!.venv/**"
publish:
  provider: github
  releaseType: release