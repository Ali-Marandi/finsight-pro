productName: FinSight Pro
appId: com.finsightpro.desktop
directories:
  output: release
files:
  - dist/**/*
  - node_modules/**/*
win:
  target:
    - target: portable
      arch:
        - x64
  icon: public/icon.ico
  signAndEditExecutable: false
  publisherName: FinSight Pro LLC
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FinSight Pro
portable:
  artifactName: FinSight-Pro-Portable-${version}-x64.exe
extraResources:
  - from: ../api
    to: api
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!venv/**"
      - "!.venv/**"
      - "!.pytest_cache/**"
      - "!*.pyc"
publish:
  provider: github
  releaseType: release
